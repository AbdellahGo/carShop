
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:15px;color:var(--color-text-primary)}
:root{--blue:#185FA5;--blue-light:#E6F1FB;--green:#3B6D11;--green-light:#EAF3DE;--amber:#854F0B;--amber-light:#FAEEDA}
.app{max-width:420px;margin:0 auto;padding:0 0 80px}
.header{background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);padding:14px 16px;position:sticky;top:0;z-index:100}

.header-title{font-size:16px;font-weight:500}
.header-sub{font-size:12px;color:var(--color-text-secondary)}
.progress-bar{height:4px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);transition:width 0.4s ease;border-radius:2px}
.progress-label{font-size:11px;color:var(--color-text-secondary);margin-top:5px;text-align:right}
.section{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin:12px;overflow:hidden;background:var(--color-background-primary)}
.section-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.section-header:active{background:var(--color-background-secondary)}
.section-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--blue-light);color:var(--blue)}
.section-meta{flex:1;margin:0 12px}
.section-name{font-size:14px;font-weight:500}
.section-count{font-size:12px;color:var(--color-text-secondary);margin-top:1px}
.chevron{font-size:18px;color:var(--color-text-secondary);transition:transform 0.25s}
.chevron.open{transform:rotate(180deg)}
.section-body{padding:0 16px 16px;border-top:0.5px solid var(--color-border-tertiary);display:none}
.section-body.open{display:block}
.field{margin-top:14px}
.field-label{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.field-label i{font-size:15px;color:var(--color-text-secondary)}
input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;padding:10px 12px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:14px;font-family:var(--font-sans);color:var(--color-text-primary);background:var(--color-background-primary);outline:none;resize:none}
input[type=text]:focus,input[type=email]:focus,input[type=tel]:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,95,165,0.15)}
.check-grid{display:flex;flex-direction:column;gap:6px}
.check-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background 0.15s}
.check-item:active{background:var(--color-background-secondary)}
.check-item.checked{background:var(--blue-light);border-color:rgba(24,95,165,0.4)}
.check-item input[type=checkbox]{display:none}
.check-box{width:18px;height:18px;border:1.5px solid var(--color-border-secondary);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--color-background-primary)}
.check-item.checked .check-box{background:var(--blue);border-color:var(--blue)}
.check-box i{font-size:12px;color:white;display:none}
.check-item.checked .check-box i{display:flex}
.check-label{font-size:13px;flex:1}
.radio-grid{display:flex;flex-direction:column;gap:6px}
.radio-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background 0.15s}
.radio-item:active{background:var(--color-background-secondary)}
.radio-item.selected{background:var(--blue-light);border-color:rgba(24,95,165,0.4)}
.radio-dot{width:18px;height:18px;border:1.5px solid var(--color-border-secondary);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--color-background-primary)}
.radio-item.selected .radio-dot{border-color:var(--blue)}
.radio-dot::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--blue);display:none}
.radio-item.selected .radio-dot::after{display:block}
.radio-label{font-size:13px;flex:1}
.section-status{width:8px;height:8px;border-radius:50%;background:var(--color-border-secondary);flex-shrink:0}
.section-status.done{background:#3B6D11}
.section-status.partial{background:#BA7517}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--color-background-primary);border-top:0.5px solid var(--color-border-tertiary);padding:12px 16px;display:flex;gap:10px;z-index:100}
.btn{flex:1;padding:11px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:13px;font-weight:500;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:6px;transition:background 0.15s}
.btn:active{background:var(--color-background-secondary);transform:scale(0.98)}
.btn-primary{background:var(--blue);color:white;border-color:var(--blue)}
.btn-primary:active{background:#0C447C}
.btn-success{background:#3B6D11;color:white;border-color:#3B6D11}
.btn-success:active{background:#27500A}
.saved-toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#3B6D11;color:white;padding:8px 18px;border-radius:var(--border-radius-md);font-size:13px;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
.saved-toast.show{opacity:1}
.summary-view{display:none;padding:12px}
.summary-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:12px}
.summary-section-title{padding:12px 16px;background:var(--blue-light);font-size:13px;font-weight:500;color:var(--blue);border-bottom:0.5px solid var(--color-border-tertiary)}
.summary-row{padding:9px 16px;display:flex;gap:8px;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px}
.summary-row:last-child{border-bottom:none}
.summary-key{color:var(--color-text-secondary);flex-shrink:0;width:45%}
.summary-val{color:var(--color-text-primary);font-weight:500;word-break:break-word}
.view-toggle{display:flex;margin:12px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);overflow:hidden}
.view-tab{flex:1;padding:9px;font-size:13px;text-align:center;cursor:pointer;border:none;background:var(--color-background-primary);color:var(--color-text-secondary);font-family:var(--font-sans);-webkit-tap-highlight-color:transparent}
.view-tab.active{background:var(--blue);color:white;font-weight:500}
</style>

let formData = {};

function loadFromStorage(){
  try{
    const saved = localStorage.getItem('cahier_charges_v2');
    if(saved){formData=JSON.parse(saved);return true;}
  }catch(e){}
  return false;
}

function saveData(){
  try{
    localStorage.setItem('cahier_charges_v2',JSON.stringify(formData));
    const d = new Date();
    document.getElementById('saved-indicator').textContent = 'Sauvegardé '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
  }catch(e){alert('Erreur de sauvegarde (mode privé ?)');}
}

function clearAll(){
  if(!confirm('Effacer toutes les réponses ?'))return;
  formData={};
  localStorage.removeItem('cahier_charges_v2');
  renderForm();
  updateProgress();
}

function getValue(id){return formData[id]||'';}
function setValue(id,val){formData[id]=val;autoSave();updateProgress();}

let autoSaveTimer;
function autoSave(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(saveData,1500);
}

function renderForm(){
  const app = document.getElementById('form-view');
  app.innerHTML='';
  SECTIONS.forEach((sec,si)=>{
    const div=document.createElement('div');
    div.className='section';
    div.id='section-'+sec.id;
    const filled=getSectionFill(sec);
    const statusClass=filled===0?'':'filled===sec.fields.length?done:partial';
    let realStatus='';
    if(filled>0&&filled<sec.fields.length)realStatus='partial';
    else if(filled===sec.fields.length&&filled>0)realStatus='done';
    div.innerHTML=`
      <div class="section-header" onclick="toggleSection('${sec.id}')">
        <div class="section-icon"><i class="ti ${sec.icon}" aria-hidden="true"></i></div>
        <div class="section-meta">
          <div class="section-name">${si+1}. ${sec.title}</div>
          <div class="section-count">${sec.fields.length} champ${sec.fields.length>1?'s':''}</div>
        </div>
        <div class="section-status ${realStatus}" id="status-${sec.id}"></div>
        <i class="ti ti-chevron-down chevron" id="chevron-${sec.id}" aria-hidden="true"></i>
      </div>
      <div class="section-body" id="body-${sec.id}"></div>
    `;
    app.appendChild(div);
    renderFields(sec);
  });
}

function renderFields(sec){
  const body=document.getElementById('body-'+sec.id);
  body.innerHTML='';
  sec.fields.forEach(f=>{
    const fd=document.createElement('div');
    fd.className='field';
    fd.innerHTML='<div class="field-label">'+f.label+'</div>';
    if(f.type==='text'||f.type==='email'||f.type==='tel'){
      const inp=document.createElement('input');
      inp.type=f.type==='tel'?'tel':'text';
      inp.placeholder=f.placeholder||'';
      inp.value=getValue(f.id);
      inp.oninput=e=>{setValue(f.id,e.target.value);updateSectionStatus(sec.id);};
      fd.appendChild(inp);
    } else if(f.type==='textarea'){
      const ta=document.createElement('textarea');
      ta.rows=3;ta.placeholder=f.placeholder||'';ta.value=getValue(f.id);
      ta.oninput=e=>{setValue(f.id,e.target.value);updateSectionStatus(sec.id);};
      fd.appendChild(ta);
    } else if(f.type==='radio'){
      const grid=document.createElement('div');grid.className='radio-grid';
      f.options.forEach(opt=>{
        const item=document.createElement('div');
        item.className='radio-item'+(getValue(f.id)===opt?' selected':'');
        item.innerHTML=`<div class="radio-dot"></div><span class="radio-label">${opt}</span>`;
        item.onclick=()=>{
          setValue(f.id,opt);
          grid.querySelectorAll('.radio-item').forEach(i=>i.classList.remove('selected'));
          item.classList.add('selected');
          updateSectionStatus(sec.id);
        };
        grid.appendChild(item);
      });
      fd.appendChild(grid);
    } else if(f.type==='checkbox'){
      const grid=document.createElement('div');grid.className='check-grid';
      const stored=getValue(f.id);
      const arr=Array.isArray(stored)?stored:(stored?[stored]:[]);
      f.options.forEach(opt=>{
        const item=document.createElement('div');
        item.className='check-item'+(arr.includes(opt)?' checked':'');
        item.innerHTML=`<div class="check-box"><i class="ti ti-check" aria-hidden="true"></i></div><span class="check-label">${opt}</span>`;
        item.onclick=()=>{
          let cur=Array.isArray(getValue(f.id))?[...getValue(f.id)]:[];
          if(cur.includes(opt))cur=cur.filter(x=>x!==opt);else cur.push(opt);
          setValue(f.id,cur);
          item.classList.toggle('checked');
          updateSectionStatus(sec.id);
        };
        grid.appendChild(item);
      });
      fd.appendChild(grid);
    }
    body.appendChild(fd);
  });
}

function toggleSection(id){
  const body=document.getElementById('body-'+id);
  const chev=document.getElementById('chevron-'+id);
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function getSectionFill(sec){
  let count=0;
  sec.fields.forEach(f=>{
    const v=getValue(f.id);
    if(Array.isArray(v)&&v.length>0)count++;
    else if(typeof v==='string'&&v.trim())count++;
  });
  return count;
}

function updateSectionStatus(secId){
  const sec=SECTIONS.find(s=>s.id===secId);
  const filled=getSectionFill(sec);
  const el=document.getElementById('status-'+secId);
  if(!el)return;
  el.className='section-status';
  if(filled>0&&filled<sec.fields.length)el.classList.add('partial');
  else if(filled>0)el.classList.add('done');
  updateProgress();
}

function updateProgress(){
  let filled=0;
  SECTIONS.forEach(s=>{if(getSectionFill(s)>0)filled++;});
  const pct=Math.round((filled/SECTIONS.length)*100);
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-text').textContent=filled+' / '+SECTIONS.length+' sections remplies';
}

function switchView(v){
  document.getElementById('form-view').style.display=v==='form'?'block':'none';
  document.getElementById('summary-view').style.display=v==='summary'?'block':'none';
  document.getElementById('tab-form').classList.toggle('active',v==='form');
  document.getElementById('tab-summary').classList.toggle('active',v==='summary');
  if(v==='summary')renderSummary();
}

function getDisplayVal(f){
  const v=getValue(f.id);
  if(!v||v==='')return '—';
  if(Array.isArray(v))return v.length?v.join(', '):'—';
  return v;
}

function renderSummary(){
  const sv=document.getElementById('summary-view');
  sv.innerHTML='';
  const company=getValue('company_name')||'Client';
  const hd=document.createElement('div');
  hd.style.cssText='padding:12px 4px 8px;font-size:15px;font-weight:500';
  hd.textContent='Résumé — '+company;
  sv.appendChild(hd);
  SECTIONS.forEach(sec=>{
    const card=document.createElement('div');card.className='summary-card';
    const title=document.createElement('div');title.className='summary-section-title';
    title.textContent=sec.title;card.appendChild(title);
    sec.fields.forEach(f=>{
      const val=getDisplayVal(f);
      if(val==='—')return;
      const row=document.createElement('div');row.className='summary-row';
      row.innerHTML=`<span class="summary-key">${f.label}</span><span class="summary-val">${val}</span>`;
      card.appendChild(row);
    });
    if(card.children.length>1)sv.appendChild(card);
  });
  const btn=document.createElement('button');
  btn.className='btn btn-primary';
  btn.style.cssText='width:100%;margin-top:4px;margin-bottom:16px';
  btn.innerHTML='<i class="ti ti-file-download" aria-hidden="true"></i> Générer le PDF';
  btn.onclick=exportPDF;
  sv.appendChild(btn);
}

function exportPDF(){
  const company=getValue('company_name')||'Client';
  const date=new Date().toLocaleDateString('fr-FR');
  let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Cahier des charges — ${company}</title>
<style>
body{font-family:Arial,sans-serif;font-size:12px;color:#111;max-width:700px;margin:0 auto;padding:24px}
h1{font-size:20px;border-bottom:2px solid #185FA5;padding-bottom:8px;color:#185FA5;margin-bottom:4px}
.meta{font-size:11px;color:#666;margin-bottom:24px}
h2{font-size:14px;background:#E6F1FB;color:#185FA5;padding:8px 12px;margin:20px 0 6px;border-left:4px solid #185FA5}
table{width:100%;border-collapse:collapse;margin-bottom:8px}
td{padding:6px 10px;border-bottom:1px solid #eee;font-size:12px;vertical-align:top}
td:first-child{color:#555;width:45%;font-weight:500}
td:last-child{color:#111}
.footer{margin-top:32px;padding-top:12px;border-top:1px solid #ddd;font-size:10px;color:#999;text-align:center}
</style></head><body>
<h1>Cahier des charges — ${company}</h1>
<div class="meta">Généré le ${date} — Formulaire de recueil des besoins</div>`;
  SECTIONS.forEach(sec=>{
    let rows='';
    sec.fields.forEach(f=>{
      const val=getDisplayVal(f);
      if(val!=='—')rows+=`<tr><td>${f.label}</td><td>${val.replace(/\n/g,'<br>')}</td></tr>`;
    });
    if(rows)html+=`<h2>${sec.title}</h2><table>${rows}</table>`;
  });
  html+=`<div class="footer">Cahier des charges généré automatiquement — confidentiel</div></body></html>`;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='cahier-des-charges-'+company.replace(/\s+/g,'-').toLowerCase()+'-'+date.replace(/\//g,'-')+'.html';
  a.click();
  URL.revokeObjectURL(url);
}

loadFromStorage();
renderForm();
updateProgress();
if(formData&&Object.keys(formData).length>0){
  const d=new Date();
  document.getElementById('saved-indicator').textContent='Chargé depuis la sauvegarde';
}
</script>
